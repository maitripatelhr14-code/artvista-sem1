<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtVista</title>
<!-- <link rel="stylesheet" href="css/Style.css"> -->
<style>
body {
    margin: 0;
    min-height: 100vh;
    background-color: #0f1724;
}
.logo-container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}
.artvista-logo {
    width: 300px;
    height: 300px;
    border: 5px solid ;
    border-radius: 50%;
    background-color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    box-shadow: 0 8px 25px #14b6a6;
}
.logo-icon {
    font-size: 50px;
    margin-bottom: 12px;
}
.logo-line {
    width: 100px;
    height: 2px;
    background-color: #475569;
    margin-bottom: 12px;
}
.logo-name {
    font-family: Georgia, serif;
    font-size: 50px;
    font-weight: bold;
    font-style: italic;
    color: #475569;
}
.logo-subtitle {
    margin-top: 8px;
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    color: #0f766e;
        }
div a {
    text-decoration: none;
    font-size: 20px;
}
</style>
</head>
<body>
<div class="logo-container">
    <div class="artvista-logo">
   <div class="logo-icon">🎨</div> 
    <div class="logo-line"></div>
    <div class="logo-name">ArtVista</div>
    <div class="logo-subtitle">ONLINE ART GALLERY</div>
    <a href="Content.html ">🔘</a>
</div>
</div>
</body>
</html>
